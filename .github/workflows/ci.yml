name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both interpreters MediaPipe supports; the test suite itself needs
        # neither MediaPipe nor a camera (all hardware-touching code is imported
        # lazily), so CI installs only numpy, a CPU torch, and pytest.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26,<2" pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Test
        run: pytest -q
